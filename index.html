<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employees Log in Portal</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#667085;--line:#e3e6eb;--hd:#3f4f23;--acc:#556b31;--accbg:#edf1e3;--bad:#b42318;--badbg:#fdecea;--warn:#b54708;--warnbg:#fef3e2;--sum:#f0f2f5}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mut:#9aa3b2;--line:#2c323c;--hd:#33401f;--acc:#8fb05a;--accbg:#232c16;--bad:#ff8a80;--badbg:#3b1f1d;--warn:#f5b361;--warnbg:#3a2c18;--sum:#242a33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:860px;margin:0 auto;padding:18px 14px 40px}.hide{display:none}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}.m{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{margin-top:14px;padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button.o{background:none;color:var(--tx);border-color:var(--line);margin:0}
button:disabled{opacity:.6}.er{color:var(--bad);font-size:13px;margin:10px 0 0}.ok{color:var(--acc);font-size:13px;margin:10px 0 0}
.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar div{display:flex;gap:8px}
.rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--tx);padding-bottom:10px;margin-bottom:12px}
.co{font-size:21px;font-weight:700;text-decoration:underline}.rt{font-size:17px;font-weight:700}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 24px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.info div{display:flex;gap:8px}.info span{color:var(--mut);min-width:118px}.info b{word-break:break-word}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;background:var(--hd);color:#fff}tr.l td{background:var(--badbg);color:var(--bad)}tr.a td{background:var(--warnbg);color:var(--warn)}
.sum{background:var(--sum);border-radius:8px;padding:12px 14px;margin-top:14px}.sum .g{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0}.sum .g div small{display:block;color:var(--mut)}.sum .g b{font-size:19px}
.sum .dd{font-weight:700;margin-top:4px}
.lg{height:84px;width:auto;display:block;margin-bottom:10px}.lg-d{display:none}@media (prefers-color-scheme:dark){.lg-l{display:none}.lg-d{display:block}}body{border-top:6px solid var(--acc)}h1{color:var(--acc)}.c{box-shadow:0 2px 10px rgba(0,0,0,.06)}#cm:empty{display:none}
.cmbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 16px;max-width:960px;margin-left:auto;margin-right:auto}
.cmh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.cmh span{color:var(--mut,#667085)}
.cmi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.cmm{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut,#667085);margin-top:6px}
.cmok{color:var(--acc);font-weight:700}.cmwait{color:#b54708;font-weight:600}
.cmn{margin-top:6px;font-size:13px;border-left:3px solid var(--acc);padding-left:8px}
#cmT{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx,inherit);font:inherit;margin-top:6px;box-sizing:border-box}
.cmf{display:flex;gap:12px;align-items:center;margin-top:8px}
.sh-paper{background:#fff;color:#111;border:1px solid #d9dee5;border-radius:10px;padding:18px 20px;font-size:13.5px;line-height:1.45;text-align:left}
.sh-paper *{box-sizing:border-box}
.sh-rh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid #999;padding-bottom:10px;margin-bottom:12px}
.sh-br{display:flex;align-items:center;gap:12px}.sh-br img{height:48px;width:auto}
.sh-co{font-size:20px;font-weight:700}.sh-ad{color:#666;font-size:12px}
.sh-rt{text-align:right;font-size:15px}
.sh-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 28px;margin-bottom:14px}
.sh-info div{display:flex;gap:8px}.sh-info span{color:#666;min-width:112px}.sh-info b{word-break:break-word}
.sh-t{overflow-x:auto}
.sh-paper table{border-collapse:collapse;width:100%;min-width:520px;margin:0}
.sh-paper th{background:#283241;color:#fff;font-size:12px;padding:7px 10px;text-align:center;border:0}.sh-paper th:first-child{text-align:left}
.sh-paper table tbody tr td,.sh-paper table tfoot tr td{padding:6px 10px;border:0;border-bottom:1px solid #e3e6eb;text-align:center;white-space:nowrap;color:#111;background:#fff}
.sh-paper table tbody tr td:first-child,.sh-paper table tfoot tr td:first-child{text-align:left}
.sh-paper table tbody tr td.sh-off{text-align:left}
.sh-paper table tbody tr.o td{background:#f4f5f7;color:#475467}
.sh-paper table tbody tr.a td{background:#fef3e2;color:#b54708}
.sh-paper table tfoot tr td{border-bottom:0;padding-top:9px}
.sh-sum{background:#f0f2f5;border-radius:8px;padding:12px 14px;margin-top:14px}.sh-sum div{margin:5px 0}.sh-rule{color:#666;font-size:11.5px}
.sheetwrap{margin:8px auto 14px;max-width:960px}</style></head><body>

const $=id=>document.getElementById(id),E=new TextEncoder(),Dc=new TextDecoder();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
async function dk(pw,salt,use){const km=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:D.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[use])}
let P=null,CUR='',UID='',USR='';
async function open_(u,p){
  const id=hex(await crypto.subtle.digest('SHA-256',E.encode(D.s+':'+u.trim().toLowerCase())));
  const r=D.r[id];if(!r)throw 'bad';
  const up=p.trim().toUpperCase();let pw=up,own=false;const ov=LS.get('pwo_'+id);
  if(ov){try{const o=JSON.parse(ov);pw=Dc.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.v)},await dk(up,ub(o.a),'decrypt'),ub(o.c)));own=true}catch(e){}}
  const tryk=async w=>JSON.parse(Dc.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(r.v)},await dk(w,ub(r.a),'decrypt'),ub(r.c))));
  try{const d=await tryk(pw);UID=id;CUR=pw;USR=u.trim();return d}
  catch(e){if(own){LS.del('pwo_'+id);try{const d=await tryk(up);UID=id;CUR=up;USR=u.trim();return d}catch(e2){throw 'reset'}}throw 'bad'}
}
async function go(){
  const b=$('go');$('er').textContent='';
  if(!window.crypto||!crypto.subtle){$('er').textContent='This browser cannot open the portal securely. Please use an up-to-date Chrome, Edge or Safari.';return}
  b.disabled=true;b.textContent='Checking…';
  try{P=await open_($('u').value,$('p').value);view()}

}

  const n=m.rows.length,rng=n?'From: '+m.rows[0].d+'  To: '+m.rows[n-1].d:'';
  const f=(l,v)=>'<div><span>'+l+':</span><b>'+esc(v||'-')+'</b></div>';
  const days=m.ded%1?m.ded.toFixed(1):String(m.ded);
  let h='<div class="sh-paper"><div class="sh-rh"><div class="sh-br"><img src="'+LOGO+'" alt="Blagle"><div><div class="sh-co">BLAGLE IMPEX</div><div class="sh-ad">Ali Street, Rowail Garha Road, Sialkot, Pakistan</div></div></div><div class="sh-rt"><b>Employees Attendance Report</b><div class="sh-ad">'+esc(rng)+'</div></div></div>';
  h+='<div class="sh-info">'+f('Employee Code',P.code)+f('Employee Name',P.name)+f('Father Name',P.father)+f('Designation',P.desig)+f('Department',P.dept)+f('Date of Joining',P.doj)+(m.shift?f('Shift',m.shift):'')+'</div>';
  h+='<div class="sh-t"><table><thead><tr><th>Date</th><th>In Time</th><th>Out Time</th><th>Short Time</th><th>Late Sitting</th></tr></thead><tbody>'+m.rows.map(r=>{const off=!r.i&&!r.o&&r.sm==null;if(off)return '<tr class="'+(r.a?'a':'o')+'"><td>'+esc(r.d)+'&nbsp;&nbsp;'+esc(r.w)+'</td><td colspan="4" class="sh-off">'+esc(r.a?'Absent':r.s==='Off (Sunday)'?'Sunday':r.s)+'</td></tr>';return '<tr><td>'+esc(r.d)+'&nbsp;&nbsp;'+esc(r.w)+'</td><td>'+esc(r.i||'')+'</td><td>'+esc(r.o||'')+'</td><td>'+hm(r.sm)+'</td><td>'+hm(r.ls)+'</td></tr>'}).join('')+'</tbody><tfoot><tr><td></td><td></td><td><b>Grand Totals:</b></td><td><b>'+hm(m.tsm||0)+'</b></td><td><b>'+hm(m.tls||0)+'</b></td></tr></tfoot></table></div>';
  if(showSum!==false)h+='<div class="sh-sum"><b>Summary</b><div>Days present: '+m.present+' &nbsp;&nbsp; Days absent: '+m.absent+' &nbsp;&nbsp; Late days (after '+m.grace+' or no check-in): '+m.late+'</div><div><b>Total late time: '+m.lt+'  ('+m.lmin+' minutes = '+(m.lmin/60).toFixed(2)+' hours)'+(m.miss?' &nbsp;|&nbsp; '+m.miss+' day(s) without check-in':'')+'</b></div><div><b>Deduction: '+(m.ded?days+' day'+(m.ded>1?'s':'')+'  ('+m.half+' x half day)':'None')+'</b></div><div class="sh-rule">Rule: '+(m.per*2)+' late days = 1 day deduction ('+m.per+' late days = half day). No check-in counts as late.</div></div>';
  return h+'</div>';
}
function drawSheet(doc,P,m,showSum){
  const W=210,M=14,n=m.rows.length;
  doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(17);try{doc.addImage(LOGO,'PNG',M,8,18.7,14)}catch(x){}doc.text('BLAGLE IMPEX',M+23,18);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(100);
  doc.text('Ali Street, Rowail Garha Road, Sialkot, Pakistan',M+23,23);doc.setTextColor(0);
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('Employees Attendance Report',W-M,18,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(n?'From: '+m.rows[0].d+'  To: '+m.rows[n-1].d:'',W-M,23,{align:'right'});
  doc.setDrawColor(150);doc.line(M,27,W-M,27);
  const info=[['Employee Code',P.code],['Employee Name',P.name],['Father Name',P.father],['Designation',P.desig],['Department',P.dept],['Date of Joining',P.doj]];if(m.shift)info.push(['Shift',m.shift]);
  doc.setFontSize(10);
  info.forEach((p,i)=>{const x=M+(i%2)*92,y=34+Math.floor(i/2)*6.5;
    doc.setFont('helvetica','normal');doc.setTextColor(100);doc.text(p[0]+':',x,y);
    doc.setFont('helvetica','bold');doc.setTextColor(0);doc.text(String(p[1]||'-'),x+30,y)});
  let y=64;const cx=[M+2,M+72,M+102,M+134,M+165];
  doc.setFillColor(40,50,65);doc.rect(M,y-5,W-2*M,7,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');
  ['Date','In Time','Out Time','Short Time','Late Sitting'].forEach((h,i)=>doc.text(h,cx[i],y,i?{align:'center'}:undefined));
  y+=7;doc.setTextColor(0);doc.setFont('helvetica','normal');
  m.rows.forEach(r=>{
    const off=!r.i&&!r.o&&r.sm==null;
    if(r.a){doc.setFillColor(254,243,226);doc.rect(M,y-4,W-2*M,5.3,'F')}
    else if(off){doc.setFillColor(244,245,247);doc.rect(M,y-4,W-2*M,5.3,'F')}
    if(off){
      doc.setTextColor(r.a?181:71,r.a?71:84,r.a?8:103);
      doc.text(r.d+'  '+r.w,cx[0],y);doc.text(r.a?'Absent':(r.s==='Off (Sunday)'?'Sunday':String(r.s||'')),M+60,y);
    }else{
      doc.setTextColor(0);
      [r.d+'  '+r.w,r.i||'',r.o||'',hm(r.sm),hm(r.ls)].forEach((t,i)=>doc.text(String(t||''),cx[i],y,i?{align:'center'}:undefined));
    }
    doc.setDrawColor(225);doc.line(M,y+1.4,W-M,y+1.4);y+=5.3;
  });
  doc.setTextColor(0);doc.setFont('helvetica','bold');doc.text('Grand Totals:',cx[2]+12,y,{align:'right'});doc.text(hm(m.tsm||0),cx[3],y,{align:'center'});doc.text(hm(m.tls||0),cx[4],y,{align:'center'});y+=7;
  if(showSum===false)return;
  if(y+40>290){doc.addPage();y=20}
  doc.setFillColor(240,242,245);doc.rect(M,y-5,W-2*M,38,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Summary',M+3,y);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text('Days present: '+m.present+'      Days absent: '+m.absent+'      Late days (after '+m.grace+' or no check-in): '+m.late,M+3,y+7);
  doc.setFont('helvetica','bold');doc.text('Total late time: '+m.lt+'  ('+m.lmin+' minutes = '+(m.lmin/60).toFixed(2)+' hours)'+(m.miss?'   |   '+m.miss+' day(s) without check-in':''),M+3,y+14);
  doc.text('Deduction: '+(m.ded?(m.ded%1?m.ded.toFixed(1):m.ded)+' day'+(m.ded>1?'s':'')+'  ('+m.half+' x half day)':'None'),M+3,y+21);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(100);
  doc.text('Rule: '+(m.per*2)+' late days = 1 day deduction ('+m.per+' late days = half day). No check-in counts as late. Generated on '+new Date().toLocaleDateString('en-GB')+'.',M+3,y+28);
  doc.setTextColor(0);
}
const CM={list:[],closed:null,err:'',started:false,busy:false};
function cmInit(){if(!P.cu||!P.ck){$('cm').innerHTML='';return false}if(!CM.started){CM.started=true;cmLoad()}return true}
async function cmLoad(){
  try{const r=await fetch(P.cu+'?a=mine&c='+encodeURIComponent(P.code)+'&k='+encodeURIComponent(P.ck));const j=await r.json();if(!j.ok)throw new Error(j.error||'error');CM.list=j.comments||[];CM.closed=j.closed||[];CM.err=''}
  catch(e){CM.err='Could not load comments. Please try again later.'}
  cmRender();
}
function cmTime(t){try{return new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return t}}
function cmRender(keep){
  if(!cmInit())return;
  const m=P.months[+$('mo').value]||P.months[0];if(!m)return;
  const closed=CM.closed?CM.closed.indexOf(m.key)>=0:!!m.closed;
  const mine=CM.list.filter(c=>c.month===m.key).sort((a,b)=>String(a.createdAt)<String(b.createdAt)?-1:1);
  let h='<div class="cmh"><b>Comments</b><span>'+esc(m.label)+'</span></div>';
  h+=mine.length?mine.map(c=>'<div class="cmi"><div>'+esc(c.text).replace(/\n/g,'<br>')+'</div><div class="cmm"><span>'+cmTime(c.createdAt)+'</span>'+(c.status==='resolved'?'<span class="cmok">Resolved'+(c.resolvedAt?' '+cmTime(c.resolvedAt):'')+'</span>':'<span class="cmwait">Waiting for review</span>')+'</div>'+(c.status==='resolved'&&c.note?'<div class="cmn">Admin: '+esc(c.note)+'</div>':'')+'</div>').join(''):'<p class="m">No comments yet for this month.</p>';
  if(CM.err)h+='<p class="m err">'+esc(CM.err)+'</p>';
  if(closed)h+='<p class="m">This month is closed. New comments cannot be added.</p>';
  else h+='<textarea id="cmT" rows="3" maxlength="1000" placeholder="If something in this sheet is wrong, write it here (for example the date and what is wrong)."></textarea><div class="cmf"><button id="cmS">Send comment</button><span class="m" id="cmE"></span></div><p class="m">You can write more than one comment. A comment cannot be changed or deleted after it is sent. The admin will review it.</p>';
  $('cm').innerHTML=h;
  if($('cmT')&&keep)$('cmT').value=keep;
  if($('cmS'))$('cmS').onclick=cmSend;
}
async function cmSend(){
  const m=P.months[+$('mo').value],t=($('cmT').value||'').trim();
  if(!t){$('cmE').textContent='Please write your comment first.';return}
  if(CM.busy)return;CM.busy=true;$('cmS').disabled=true;$('cmE').textContent='Sending...';
  try{const r=await fetch(P.cu,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'add',c:P.code,k:P.ck,n:P.name,m:m.key,t})});const j=await r.json();if(!j.ok)throw new Error(j.error||'error');CM.busy=false;await cmLoad()}
  catch(e){CM.busy=false;cmRender(t);if($('cmE'))$('cmE').textContent=(e&&e.message)||'Could not send. Please try again.'}
}
function mon(i){$('sheet').innerHTML=sheetHTML(P,P.months[i],P.sum!==false);cmRender()}
function pmsg(t,ok){const e=$('pm');e.textContent=t;e.className=ok?'ok':'er'}
async function reqCode(u,pw){
  if(!D.k)return '';
  const key=await crypto.subtle.importKey('spki',ub(D.k),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
  return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},key,E.encode(JSON.stringify({u,p:pw}))));
}
async function savePw(){
  const a=$('n1').value.trim().toUpperCase(),b=$('n2').value.trim().toUpperCase();
  if(a.length<8||!/[A-Z]/.test(a)||!/\d/.test(a))return pmsg('Please use at least 8 characters, with both letters and numbers.');
  if(a!==b)return pmsg('The two passwords do not match.');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await dk(a,salt,'encrypt'),E.encode(CUR));
    if(!LS.set('pwo_'+UID,JSON.stringify({a:b64(salt),v:b64(iv),c:b64(ct)})))return pmsg('Could not save the password: this browser blocks storage.');
    $('n1').value=$('n2').value='';
    const code=await reqCode(USR,a);
    if(code){$('rq').value=code;$('rqw').classList.remove('hide')}
    pmsg('Password changed. Use it next time on this device.'+(code?' To use it on other devices too, send the code below to the admin office.':''),1);
  }catch(e){pmsg('Could not change the password.')}
}
function pdf(){
  const m=P&&P.months[+$('mo').value];if(!m||!window.jspdf)return;
  const doc=new jspdf.jsPDF({unit:'mm',format:'a4'});drawSheet(doc,P,m,P.sum!==false);
  doc.save((P.code+' - '+P.name+' - '+m.label+'.pdf').replace(/[\\/:*?"<>|]/g,'').trim());
}
$('dl').onclick=pdf;if(!window.jspdf)$('dl').classList.add('hide');
$('go').onclick=go;
$('p').onkeydown=e=>{if(e.key==='Enter')go()};
$('cp').onclick=()=>{$('pw').classList.toggle('hide');pmsg('');$('rqw').classList.add('hide');$('cpy').textContent='Copy code'};
$('cc').onclick=()=>$('pw').classList.add('hide');
$('cpy').onclick=()=>{const t=$('rq');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}$('cpy').textContent='Copied'};
$('sv').onclick=savePw;
$('out').onclick=()=>{P=null;CUR='';$('u').value='';$('p').value='';$('pv').classList.add('hide');$('lg').classList.remove('hide')};
</script>
